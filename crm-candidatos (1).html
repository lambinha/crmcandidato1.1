<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0B0A10; --panel:#131219; --panel2:#161520; --border:#211F2C;
    --text:#EDEBF5; --muted:#9B98AC; --muted2:#6B6880;
    --violet:#8B5CF6; --violet2:#6D28D9;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    padding:28px 24px 60px;
  }
  ::placeholder{ color:var(--muted2); }
  select{ color-scheme: dark; }
  a{ text-decoration:none; }

  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .btn{ cursor:pointer; transition:transform .15s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease; }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0) scale(.98); }

  .icon-btn{ transition:transform .15s ease, background .2s ease, color .2s ease; cursor:pointer; }
  .icon-btn:hover{ transform:translateY(-2px); }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn.disabled{ cursor:not-allowed; opacity:.5; }
  .icon-btn.disabled:hover{ transform:none; }

  .stat-card{
    cursor:pointer; border-radius:12px; padding:12px 10px;
    background:var(--panel); border:1px solid var(--border);
    transition:background .25s ease, border-color .25s ease, transform .15s ease;
  }
  .stat-card:hover{ transform:translateY(-2px); }
  .stat-num{ font-size:20px; font-weight:800; transition:color .25s ease; }
  .stat-label{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .row-card{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--panel); border:1px solid #201E2A; border-radius:10px;
    padding:12px 14px; border-left:3px solid transparent;
    transition:background .2s ease, border-color .2s ease, transform .18s ease, box-shadow .18s ease;
  }
  .row-card:hover{ background:#16151F; transform:translateX(2px); box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .row-card.removing{ animation:rowOut .25s ease forwards; }
  @keyframes rowOut{ to{ opacity:0; transform:translateX(12px) scale(.98); max-height:0; padding-top:0; padding-bottom:0; margin:0; } }

  input, textarea, select{
    font-family:inherit; transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  input:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--violet) !important; box-shadow:0 0 0 3px rgba(139,92,246,.18);
  }

  .status-select{ transition:background .25s ease, color .25s ease, border-color .25s ease; }

  #modalOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,0); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
    transition:background .25s ease;
  }
  #modalOverlay.open{ display:flex; background:rgba(0,0,0,.6); }
  #modalCard{
    background:var(--panel2); border:1px solid #2A2836; border-radius:16px; padding:24px;
    width:100%; max-width:440px; max-height:88vh; overflow-y:auto;
    transform:translateY(14px) scale(.97); opacity:0;
    transition:transform .28s cubic-bezier(.16,1,.3,1), opacity .22s ease;
  }
  #modalOverlay.open #modalCard{ transform:translateY(0) scale(1); opacity:1; }

  .toast{
    padding:10px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;
    max-height:0; opacity:0; overflow:hidden; transition:max-height .3s ease, opacity .3s ease, padding .3s ease, margin .3s ease;
  }
  .toast.show{ max-height:60px; opacity:1; padding:10px 14px; margin-bottom:16px; }
  .toast.ok{ background:#122A19; color:#4ADE80; border:1px solid #1F4D2E; }
  .toast.err{ background:#2A1414; color:#FF8080; border:1px solid #4D1F1F; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted2); border:1px dashed #2A2836; border-radius:14px; }

  .tabs-wrap{
    display:flex; align-items:center; gap:4px; margin-bottom:18px; overflow-x:auto;
    border-bottom:1px solid var(--border); padding-bottom:0;
  }
  .tabs-wrap::-webkit-scrollbar{ height:0; }
  .tab-btn{
    display:flex; align-items:center; gap:8px; white-space:nowrap; cursor:pointer;
    padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--muted);
    border:none; background:none; border-bottom:2px solid transparent; margin-bottom:-1px;
    transition:color .18s ease, border-color .18s ease;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--violet); }
  .tab-btn .tab-count{
    font-size:11px; font-weight:700; background:#1E1C29; color:var(--muted); padding:1px 7px; border-radius:999px;
  }
  .tab-btn.active .tab-count{ background:#2A1A3F; color:#D9A5FF; }
  .tab-close{
    display:flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%;
    color:var(--muted2); transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .tab-close:hover{ background:#2A1414; color:#FF8080; transform:scale(1.15); }

  #fileInput{ display:none; }

  @media (max-width:640px){
    .toolbar{ flex-direction:column; align-items:stretch !important; }
    .stats-grid{ grid-template-columns:repeat(2,1fr) !important; }
  }
</style>
</head>
<body>

<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
  <div>
    <div style="font-size:12px; letter-spacing:2px; color:var(--violet); font-weight:700; margin-bottom:4px;">NEXA · PROSPECÇÃO</div>
    <h1 style="font-size:26px; font-weight:800; margin:0; letter-spacing:-0.5px;">CRM de Candidatos</h1>
  </div>
  <div style="display:flex; gap:10px;">
    <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" />
    <button class="btn" id="importBtn" style="display:flex; align-items:center; gap:8px; background:#181721; border:1px solid #2A2836; color:var(--text); padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Importar Excel
    </button>
    <button class="btn" id="addBtn" style="display:flex; align-items:center; gap:8px; background:linear-gradient(135deg,var(--violet),var(--violet2)); border:none; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar
    </button>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="tabsWrap" class="tabs-wrap"></div>

<div id="statsGrid" class="stats-grid" style="display:grid; gap:10px; margin-bottom:22px;"></div>

<div class="toolbar" style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
  <div style="position:relative; flex:1; min-width:220px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6880" stroke-width="2" style="position:absolute; left:12px; top:12px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" placeholder="Buscar por nome, cidade, partido ou cargo..." style="width:100%; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px 10px 36px; color:var(--text); font-size:14px;" />
  </div>
</div>

<div id="listWrap" style="display:flex; flex-direction:column; gap:8px;"></div>

<div id="modalOverlay">
  <div id="modalCard">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
      <h3 id="modalTitle" style="margin:0; font-size:17px; font-weight:700;">Novo candidato</h3>
      <button id="closeModal" style="background:none; border:none; color:var(--muted); cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="formFields"></div>
    <div style="display:flex; gap:10px; margin-top:8px;">
      <button id="cancelBtn" class="btn" style="flex:1; background:#1E1C29; border:1px solid #2A2836; color:var(--text); padding:10px; border-radius:8px; font-size:14px; font-weight:600;">Cancelar</button>
      <button id="saveBtn" class="btn" style="flex:1; background:linear-gradient(135deg,var(--violet),var(--violet2)); border:none; color:#fff; padding:10px; border-radius:8px; font-size:14px; font-weight:600;">Salvar</button>
    </div>
  </div>
</div>

<script>
const STATUSES = [
  { id:"novo", label:"Novo", color:"#8B8FA3", bg:"#1C1D28" },
  { id:"contato", label:"Contato feito", color:"#7DA3FF", bg:"#151E30" },
  { id:"respondeu", label:"Respondeu", color:"#FFC15E", bg:"#2A2313" },
  { id:"demo", label:"Demo enviada", color:"#B98CFF", bg:"#221A31" },
  { id:"reuniao", label:"Reunião marcada", color:"#5FE0C7", bg:"#122822" },
  { id:"fechado", label:"Fechado", color:"#4ADE80", bg:"#122A19" },
  { id:"perdido", label:"Sem interesse", color:"#FF6B6B", bg:"#2A1414" },
];

let candidatos = [];
let importacoes = [];
let search = "";
let filterStatus = "todos";
let activeTab = "todos";
let editingId = null;
let form = emptyForm();

function emptyForm(){
  return { nome:"", cidade:"", cargo:"", partido:"", telefone:"", instagram:"", status:"novo", obs:"" };
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function normalize(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
function statusMeta(id){ return STATUSES.find(s=>s.id===id) || STATUSES[0]; }
function igUrl(v){
  if(!v) return null;
  v = String(v).trim();
  if(!v) return null;
  if(v.startsWith("http")) return v;
  v = v.replace(/^@/, "");
  return "https://instagram.com/" + v;
}
function waUrl(v){
  if(!v) return null;
  let digits = String(v).replace(/\D/g,"");
  if(!digits) return null;
  if(digits.length<=11) digits = "55"+digits;
  return "https://wa.me/"+digits;
}
function findKey(row, cands){
  const keys = Object.keys(row);
  for(const k of keys){
    const nk = normalize(k);
    if(cands.some(c=>nk.includes(c))) return k;
  }
  return null;
}

async function loadData(){
  try{
    const res = await window.storage.get("candidatos", false);
    if(res && res.value) candidatos = JSON.parse(res.value);
  }catch(e){}
  try{
    const res2 = await window.storage.get("importacoes", false);
    if(res2 && res2.value) importacoes = JSON.parse(res2.value);
  }catch(e){}
  render();
}
async function saveData(){
  try{ await window.storage.set("candidatos", JSON.stringify(candidatos), false); }
  catch(e){ console.error("Erro ao salvar", e); }
}
async function saveImports(){
  try{ await window.storage.set("importacoes", JSON.stringify(importacoes), false); }
  catch(e){ console.error("Erro ao salvar importações", e); }
}

function showToast(text, ok){
  const el = document.getElementById("toast");
  el.textContent = text;
  el.className = "toast show " + (ok? "ok":"err");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ el.className = "toast " + (ok? "ok":"err"); }, 5000);
}

function getTabCandidatos(){
  if(activeTab==="todos") return candidatos;
  if(activeTab==="manual") return candidatos.filter(c=>!c.importId);
  return candidatos.filter(c=>c.importId===activeTab);
}

function renderStats(){
  const grid = document.getElementById("statsGrid");
  grid.style.gridTemplateColumns = `repeat(${STATUSES.length+1}, 1fr)`;
  const scoped = getTabCandidatos();
  const total = scoped.length;
  const byStatus = {};
  STATUSES.forEach(s=> byStatus[s.id]=0);
  scoped.forEach(c=> byStatus[c.status] = (byStatus[c.status]||0)+1);

  let html = `<div class="stat-card" data-filter="todos" style="${filterStatus==='todos' ? 'background:#1C1A28;border-color:var(--violet);' : ''}">
    <div class="stat-num">${total}</div><div class="stat-label">Todos</div></div>`;
  STATUSES.forEach(s=>{
    const active = filterStatus===s.id;
    html += `<div class="stat-card" data-filter="${s.id}" style="${active ? `background:${s.bg};border-color:${s.color};` : ''}">
      <div class="stat-num" style="color:${s.color}">${byStatus[s.id]||0}</div>
      <div class="stat-label">${s.label}</div></div>`;
  });
  grid.innerHTML = html;
  grid.querySelectorAll(".stat-card").forEach(el=>{
    el.addEventListener("click", ()=>{ filterStatus = el.dataset.filter; render(); });
  });
}

function getFiltered(){
  const q = normalize(search);
  return candidatos.filter(c=>{
    const matchesSearch = !q ||
      normalize(c.nome).includes(q) ||
      normalize(c.cidade).includes(q) ||
      normalize(c.partido).includes(q) ||
      normalize(c.cargo).includes(q);
    const matchesStatus = filterStatus==="todos" || c.status===filterStatus;
    const matchesTab = activeTab==="todos" ? true :
      activeTab==="manual" ? !c.importId :
      c.importId===activeTab;
    return matchesSearch && matchesStatus && matchesTab;
  });
}

function renderList(){
  const wrap = document.getElementById("listWrap");
  const filtered = getFiltered();

  if(filtered.length===0){
    const tabEmpty = getTabCandidatos().length===0;
    wrap.innerHTML = `<div class="empty-state fade-in">
      ${tabEmpty
        ? `<div style="font-size:15px; margin-bottom:6px;">Nenhum candidato aqui ainda.</div>
           <div style="font-size:13.5px;">Importe uma planilha ou adicione manualmente para começar.</div>`
        : `<div style="font-size:15px;">Nenhum resultado para esse filtro.</div>`}
    </div>`;
    return;
  }

  wrap.innerHTML = filtered.map((c,i)=>{
    const meta = statusMeta(c.status);
    const ig = igUrl(c.instagram);
    const wa = waUrl(c.telefone);
    const sub = [c.cargo, c.partido].filter(Boolean).join(" · ");
    return `
    <div class="row-card fade-in" style="border-left-color:${meta.color}; animation-delay:${Math.min(i*25,300)}ms;" data-id="${c.id}">
      <div style="flex:1 1 220px; min-width:180px;">
        <div style="font-weight:700; font-size:15px;">${escapeHtml(c.nome)}</div>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:3px; font-size:12.5px; color:var(--muted);">
          ${c.cidade ? `<span style="display:flex; align-items:center; gap:4px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${escapeHtml(c.cidade)}</span>` : ""}
          ${sub ? `<span>${escapeHtml(sub)}</span>` : ""}
        </div>
      </div>

      <select class="status-select" data-id="${c.id}" style="background:${meta.bg}; color:${meta.color}; border:1px solid ${meta.color}55; border-radius:8px; padding:6px 8px; font-size:12.5px; font-weight:600;">
        ${STATUSES.map(s=>`<option value="${s.id}" ${s.id===c.status?"selected":""}>${s.label}</option>`).join("")}
      </select>

      <div style="display:flex; gap:6px;">
        <a href="${ig || '#'}" target="_blank" rel="noopener noreferrer" class="icon-btn ${ig?"":"disabled"}" title="${ig? "Abrir Instagram":"Sem Instagram cadastrado"}"
           style="display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; background:${ig? "#2A1A3A":"#171620"}; color:${ig? "#D9A5FF":"#4A4858"};"
           ${ig? "" : "onclick=\"return false;\""}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </a>
        <a href="${wa || '#'}" target="_blank" rel="noopener noreferrer" class="icon-btn ${wa?"":"disabled"}" title="${wa? "Abrir WhatsApp":"Sem telefone cadastrado"}"
           style="display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; background:${wa? "#122A19":"#171620"}; color:${wa? "#4ADE80":"#4A4858"};"
           ${wa? "" : "onclick=\"return false;\""}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </a>
        <button class="icon-btn editBtn" data-id="${c.id}" style="width:34px; height:34px; border-radius:8px; background:#171620; border:none; color:#B8B5C8; display:flex; align-items:center; justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
        </button>
        <button class="icon-btn delBtn" data-id="${c.id}" style="width:34px; height:34px; border-radius:8px; background:#171620; border:none; color:#FF8080; display:flex; align-items:center; justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>`;
  }).join("");

  wrap.querySelectorAll(".status-select").forEach(el=>{
    el.addEventListener("change", (e)=>{
      const id = el.dataset.id;
      const c = candidatos.find(x=>x.id===id);
      if(c){ c.status = e.target.value; saveData(); render(); }
    });
  });
  wrap.querySelectorAll(".editBtn").forEach(el=>{
    el.addEventListener("click", ()=> openEdit(el.dataset.id));
  });
  wrap.querySelectorAll(".delBtn").forEach(el=>{
    el.addEventListener("click", ()=>{
      const card = el.closest(".row-card");
      card.classList.add("removing");
      setTimeout(()=>{
        candidatos = candidatos.filter(c=>c.id!==el.dataset.id);
        saveData();
        render();
      }, 230);
    });
  });
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function renderTabs(){
  const wrap = document.getElementById("tabsWrap");
  const manualCount = candidatos.filter(c=>!c.importId).length;

  let html = `<button class="tab-btn ${activeTab==='todos'?'active':''}" data-tab="todos">
    Todos <span class="tab-count">${candidatos.length}</span>
  </button>`;

  importacoes.forEach(imp=>{
    const count = candidatos.filter(c=>c.importId===imp.id).length;
    html += `<button class="tab-btn ${activeTab===imp.id?'active':''}" data-tab="${imp.id}" title="${escapeHtml(imp.nome)}">
      ${escapeHtml(truncate(imp.nome, 22))} <span class="tab-count">${count}</span>
      <span class="tab-close" data-remove-tab="${imp.id}" title="Remover esta planilha">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>
    </button>`;
  });

  if(manualCount>0 || importacoes.length===0){
    html += `<button class="tab-btn ${activeTab==='manual'?'active':''}" data-tab="manual">
      Adicionados manualmente <span class="tab-count">${manualCount}</span>
    </button>`;
  }

  wrap.innerHTML = html;

  wrap.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      if(e.target.closest("[data-remove-tab]")) return;
      activeTab = btn.dataset.tab;
      render();
    });
  });
  wrap.querySelectorAll("[data-remove-tab]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = el.dataset.removeTab;
      const imp = importacoes.find(i=>i.id===id);
      const ok = confirm(`Remover a planilha "${imp?.nome||''}" e seus ${imp?.total||0} candidato(s) do CRM?`);
      if(!ok) return;
      candidatos = candidatos.filter(c=>c.importId!==id);
      importacoes = importacoes.filter(i=>i.id!==id);
      if(activeTab===id) activeTab = "todos";
      saveData();
      saveImports();
      render();
    });
  });
}

function truncate(s, n){
  s = String(s||"");
  return s.length>n ? s.slice(0,n-1)+"…" : s;
}

function render(){
  renderStats();
  renderTabs();
  renderList();
}

// ---- Modal ----
const FIELD_DEFS = [
  { key:"nome", label:"Nome *", placeholder:"Ex: João da Silva" },
  { key:"cidade", label:"Cidade", placeholder:"Ex: Itapipoca" },
  { key:"cargo", label:"Cargo", placeholder:"Ex: Vereador" },
  { key:"partido", label:"Partido", placeholder:"Ex: PDT" },
  { key:"telefone", label:"Telefone / WhatsApp", placeholder:"Ex: (85) 99999-9999" },
  { key:"instagram", label:"Instagram", placeholder:"Ex: @joaosilva ou link" },
];

function renderForm(){
  const wrap = document.getElementById("formFields");
  let html = "";
  FIELD_DEFS.forEach(f=>{
    html += `<div style="margin-bottom:12px;">
      <label style="display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;">${f.label}</label>
      <input data-key="${f.key}" value="${escapeHtml(form[f.key])}" placeholder="${f.placeholder}"
        style="width:100%; background:#0F0E16; border:1px solid #2A2836; border-radius:8px; padding:9px 11px; color:var(--text); font-size:14px;" />
    </div>`;
  });
  html += `<div style="margin-bottom:12px;">
    <label style="display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;">Status</label>
    <select id="formStatus" style="width:100%; background:#0F0E16; border:1px solid #2A2836; border-radius:8px; padding:9px 11px; color:var(--text); font-size:14px;">
      ${STATUSES.map(s=>`<option value="${s.id}" ${s.id===form.status?"selected":""}>${s.label}</option>`).join("")}
    </select>
  </div>
  <div style="margin-bottom:4px;">
    <label style="display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;">Observações</label>
    <textarea id="formObs" rows="3" placeholder="Anotações sobre a abordagem..."
      style="width:100%; background:#0F0E16; border:1px solid #2A2836; border-radius:8px; padding:9px 11px; color:var(--text); font-size:14px; resize:vertical;">${escapeHtml(form.obs)}</textarea>
  </div>`;
  wrap.innerHTML = html;

  wrap.querySelectorAll("input[data-key]").forEach(inp=>{
    inp.addEventListener("input", ()=>{ form[inp.dataset.key] = inp.value; });
  });
  document.getElementById("formStatus").addEventListener("change", (e)=>{ form.status = e.target.value; });
  document.getElementById("formObs").addEventListener("input", (e)=>{ form.obs = e.target.value; });
}

function openModal(){
  document.getElementById("modalOverlay").classList.add("open");
  renderForm();
}
function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
}
function openNew(){
  form = emptyForm();
  editingId = null;
  document.getElementById("modalTitle").textContent = "Novo candidato";
  openModal();
}
function openEdit(id){
  const c = candidatos.find(x=>x.id===id);
  if(!c) return;
  form = { nome:c.nome, cidade:c.cidade, cargo:c.cargo, partido:c.partido, telefone:c.telefone, instagram:c.instagram, status:c.status, obs:c.obs||"" };
  editingId = id;
  document.getElementById("modalTitle").textContent = "Editar candidato";
  openModal();
}
function saveForm(){
  if(!form.nome.trim()) return;
  if(editingId){
    const c = candidatos.find(x=>x.id===editingId);
    Object.assign(c, form);
  } else {
    candidatos.unshift({ id: uid(), ...form });
    activeTab = "manual";
  }
  saveData();
  closeModal();
  render();
}

// ---- Import ----
function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type:"array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:"" });
      if(!rows.length){ showToast("Planilha vazia ou sem dados legíveis.", false); return; }
      const sample = rows[0];
      const kNome = findKey(sample, ["nome","candidato"]);
      const kCidade = findKey(sample, ["cidade","municipio"]);
      const kCargo = findKey(sample, ["cargo"]);
      const kPartido = findKey(sample, ["partido","sigla"]);
      const kTelefone = findKey(sample, ["telefone","whatsapp","celular","fone","contato"]);
      const kInstagram = findKey(sample, ["instagram","insta"]);

      const importId = uid();

      const novos = rows.map(r=>({
        id: uid(),
        nome: kNome ? String(r[kNome]).trim() : "",
        cidade: kCidade ? String(r[kCidade]).trim() : "",
        cargo: kCargo ? String(r[kCargo]).trim() : "",
        partido: kPartido ? String(r[kPartido]).trim() : "",
        telefone: kTelefone ? String(r[kTelefone]).trim() : "",
        instagram: kInstagram ? String(r[kInstagram]).trim() : "",
        status: "novo",
        obs: "",
        importId,
      })).filter(c=>c.nome);

      if(novos.length){
        importacoes.unshift({ id: importId, nome: file.name, data: new Date().toISOString(), total: novos.length });
        saveImports();
      }

      candidatos = [...novos, ...candidatos];
      saveData();
      activeTab = novos.length ? importId : activeTab;
      render();
      showToast(`${novos.length} candidato(s) importado(s) com sucesso.`, true);
    }catch(err){
      showToast("Não consegui ler essa planilha. Confira o formato (.xlsx ou .csv).", false);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
}

// ---- Wire up ----
document.getElementById("importBtn").addEventListener("click", ()=> document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change", handleFile);
document.getElementById("addBtn").addEventListener("click", openNew);
document.getElementById("closeModal").addEventListener("click", closeModal);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
document.getElementById("saveBtn").addEventListener("click", saveForm);
document.getElementById("modalOverlay").addEventListener("click", (e)=>{ if(e.target.id==="modalOverlay") closeModal(); });
document.getElementById("searchInput").addEventListener("input", (e)=>{ search = e.target.value; renderList(); });

loadData();
</script>
